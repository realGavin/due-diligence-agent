[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddagent"
version = "0.1.0"
description = "Grounded multi-agent due diligence on SEC filings: analysts, a red team, and a code-enforced citation gate."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gavin Zeng"}]
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dd = "ddagent.cli:main"

[tool.setuptools]
packages = ["ddagent"]
